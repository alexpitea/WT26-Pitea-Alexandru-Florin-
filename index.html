<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proiectul Meu Simplu</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
        }
        h1 {
            color: #007BFF;
            margin-top: 0;
        }
        p {
            font-size: 16px;
            line-height: 1.5;
        }
        button {
            background-color: #007BFF;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Salutare! 👋</h1>
        <p>Acesta este primul meu proiect creat în HTML, stilizat cu CSS și cu o funcție mică de JavaScript.</p>
        <button onclick="saluta()">Apasă-mă</button>
    </div>

    <script>
        function saluta() {
            alert("Felicitări! Ai rulat cu succes codul în VS Code! 🎉");
        }
    </script>

</body>
</html>
